name: Cypress Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar testes E2E do Cypress no Chrome (Headless)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true